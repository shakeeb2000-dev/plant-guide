/* =============================================================
   PLANT GUIDE — styles
   -------------------------------------------------------------
   Two complete looks, switched by the data-theme attribute on
   <html>:

     data-theme="control"      Control Room  — dark, glowing,
                               like the FactoryTalk screens.
     data-theme="industrial"   Bold Industrial — high contrast,
                               heavy type, safety-sign feel.

   Everything below is driven by the variables in each theme
   block, so adding a third look later means adding one block.
   ============================================================= */

/* =============================================================
   1. THEME: CONTROL ROOM (dark)
   ============================================================= */

:root,
[data-theme="control"] {
  --bg:            #070b0a;
  --bg-grad:       radial-gradient(1200px 620px at 18% -8%, #10211b 0%, transparent 62%),
                   radial-gradient(900px 520px at 88% 4%, #0d1b26 0%, transparent 58%),
                   linear-gradient(180deg, #070b0a 0%, #05080a 100%);
  --panel:         rgba(19, 29, 26, .82);
  --panel-solid:   #121c19;
  --panel-raised:  linear-gradient(165deg, rgba(34,50,45,.92) 0%, rgba(16,26,23,.92) 100%);
  --panel-hover:   rgba(27, 42, 37, .92);
  --line:          rgba(104, 150, 136, .22);
  --line-strong:   rgba(104, 150, 136, .40);

  --ink:           #e4f1ec;
  --ink-soft:      #8ba9a1;
  --ink-faint:     #5d7a73;

  --accent:        #2ce08c;
  --accent-ink:    #04150d;
  --accent-soft:   rgba(44, 224, 140, .14);
  --accent-line:   rgba(44, 224, 140, .45);

  --amber:         #ffb74d;
  --amber-soft:    rgba(255, 183, 77, .12);
  --amber-line:    rgba(255, 183, 77, .42);

  --red:           #ff6b60;
  --red-soft:      rgba(255, 107, 96, .12);
  --red-line:      rgba(255, 107, 96, .42);

  --blue:          #4fc3f7;
  --blue-soft:     rgba(79, 195, 247, .12);
  --blue-line:     rgba(79, 195, 247, .40);

  --violet:        #b794f6;

  --radius:        16px;
  --radius-sm:     11px;
  --radius-lg:     22px;

  --shadow:        0 1px 0 rgba(255,255,255,.04) inset,
                   0 18px 40px -22px rgba(0,0,0,.9);
  --shadow-lift:   0 1px 0 rgba(255,255,255,.07) inset,
                   0 26px 54px -20px rgba(0,0,0,.95);
  --glow:          0 0 0 1px var(--accent-line), 0 0 26px -6px rgba(44,224,140,.45);

  --font:          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --head-weight:   700;
  --head-tracking: -0.015em;
  --head-transform:none;
  --label-tracking:.10em;

  --border-w:      1px;
  --tile-skin:     var(--panel-raised);
  --map-canvas:    #080e0c;
  --map-grid:      rgba(104, 150, 136, .09);
  --map-node:      rgba(22, 34, 30, .96);
  --flow-anim:     1;
}

/* =============================================================
   2. THEME: BOLD INDUSTRIAL (high contrast)
   ============================================================= */

[data-theme="industrial"] {
  --bg:            #e8e4da;
  --bg-grad:       linear-gradient(180deg, #edeae1 0%, #e2ded3 100%);
  --panel:         #ffffff;
  --panel-solid:   #ffffff;
  --panel-raised:  #ffffff;
  --panel-hover:   #fffdf2;
  --line:          #15130f;
  --line-strong:   #15130f;

  --ink:           #15130f;
  --ink-soft:      #4e4a42;
  --ink-faint:     #6f6a60;

  --accent:        #0b7a3f;
  --accent-ink:    #ffffff;
  --accent-soft:   #d8f0e2;
  --accent-line:   #0b7a3f;

  --amber:         #a35a00;
  --amber-soft:    #ffd400;
  --amber-line:    #15130f;

  --red:           #b3160f;
  --red-soft:      #ffd9d6;
  --red-line:      #15130f;

  --blue:          #11399e;
  --blue-soft:     #d9e2ff;
  --blue-line:     #15130f;

  --violet:        #5b2bb8;

  --radius:        4px;
  --radius-sm:     3px;
  --radius-lg:     6px;

  --shadow:        5px 5px 0 0 #15130f;
  --shadow-lift:   8px 8px 0 0 #15130f;
  --glow:          0 0 0 3px #ffd400, 5px 5px 0 0 #15130f;

  --font:          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono:     ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --head-weight:   900;
  --head-tracking: -0.02em;
  --head-transform:uppercase;
  --label-tracking:.14em;

  --border-w:      3px;
  --tile-skin:     #ffffff;
  --map-canvas:    #faf8f3;
  --map-grid:      rgba(21, 19, 15, .09);
  --map-node:      #ffffff;
  --flow-anim:     0;
}

/* =============================================================
   3. RESET AND BASE
   ============================================================= */

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 16.5px;
  line-height: 1.55;
  min-height: 100vh;
  overflow-x: hidden;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

h1 {
  font-size: clamp(25px, 3.4vw, 36px);
  font-weight: var(--head-weight);
  letter-spacing: var(--head-tracking);
  text-transform: var(--head-transform);
  margin: 0 0 8px;
  line-height: 1.12;
}

h2 {
  font-size: clamp(18px, 2vw, 22px);
  font-weight: var(--head-weight);
  letter-spacing: var(--label-tracking);
  text-transform: uppercase;
  margin: 38px 0 16px;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 14px;
}
h2::after {
  content: "";
  flex: 1;
  height: var(--border-w);
  background: var(--line);
}
[data-theme="industrial"] h2 { color: var(--ink); }

h3 {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: var(--label-tracking);
  text-transform: uppercase;
  color: var(--ink-soft);
}
[data-theme="industrial"] h3 { color: var(--ink); }

.lede { color: var(--ink-soft); margin: 0 0 24px; max-width: 70ch; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* =============================================================
   4. DRAFT BANNER
   ============================================================= */

.draft-banner {
  position: relative;
  padding: 9px 18px;
  font-size: 13.5px;
  text-align: center;
  color: var(--amber);
  background: var(--amber-soft);
  border-bottom: var(--border-w) solid var(--amber-line);
  letter-spacing: .01em;
}
.draft-banner strong { letter-spacing: .06em; }

[data-theme="industrial"] .draft-banner {
  color: var(--ink);
  background: repeating-linear-gradient(
    135deg, #ffd400 0 18px, #15130f 18px 36px
  );
  padding: 0;
  border-bottom: 3px solid #15130f;
}
[data-theme="industrial"] .draft-banner > span {
  display: block;
  background: #ffd400;
  margin: 5px 0;
  padding: 7px 18px;
  font-weight: 800;
}

/* =============================================================
   5. TOP BAR
   ============================================================= */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px clamp(14px, 3vw, 28px);
  background: var(--panel);
  border-bottom: var(--border-w) solid var(--line);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
}
[data-theme="industrial"] .topbar {
  background: #15130f;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-bottom: 3px solid #15130f;
}

.brand {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; margin-right: auto;
  color: inherit; text-decoration: none;
}
.brand:hover .brand-name { color: var(--accent); }
[data-theme="industrial"] .brand:hover .brand-name { color: #ffd400; }

.brand-mark {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: var(--border-w) solid var(--accent-line);
  color: var(--accent);
}
[data-theme="industrial"] .brand-mark {
  background: #ffd400; border-color: #ffd400; color: #15130f;
}
.brand-mark svg { width: 24px; height: 24px; }

.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name {
  font-weight: 800;
  font-size: 15.5px;
  letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-sub {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: var(--label-tracking);
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="industrial"] .brand-name { color: #fff; }
[data-theme="industrial"] .brand-sub { color: #b8b2a6; }

.nav-btn {
  flex: 0 0 auto;
  height: 42px;
  padding: 0 15px;
  display: inline-flex; align-items: center; gap: 8px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-soft);
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: background .14s, color .14s, border-color .14s, transform .08s;
}
.nav-btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.nav-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--panel-hover); }
.nav-btn:active { transform: translateY(1px); }
[data-theme="industrial"] .nav-btn {
  border-color: #4a453c; color: #e8e4da; background: #241f19;
}
[data-theme="industrial"] .nav-btn:hover { background: #ffd400; color: #15130f; border-color: #ffd400; }

.search { display: flex; gap: 8px; flex: 0 1 320px; min-width: 0; }
.search-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
.search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--ink-faint); pointer-events: none;
}
.search input {
  width: 100%;
  height: 42px;
  padding: 0 14px 0 36px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
}
.search input::placeholder { color: var(--ink-faint); }
.search input:focus { border-color: var(--accent-line); outline: none; box-shadow: var(--glow); }
[data-theme="industrial"] .search input { background: #fff; border-color: #15130f; }

.search button {
  height: 42px; padding: 0 16px;
  border: var(--border-w) solid var(--accent-line);
  border-radius: var(--radius-sm);
  background: var(--accent); color: var(--accent-ink);
  font-weight: 800; cursor: pointer;
  transition: filter .14s, transform .08s;
}
.search button:hover { filter: brightness(1.1); }
.search button:active { transform: translateY(1px); }

/* =============================================================
   6. LAYOUT
   ============================================================= */

.view {
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(20px, 3vw, 34px) clamp(14px, 3vw, 28px) 70px;
  animation: pageIn .26s cubic-bezier(.2, .7, .3, 1);
}
.view.wide { max-width: none; padding-left: clamp(10px, 2vw, 20px); padding-right: clamp(10px, 2vw, 20px); }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
}

.footer {
  max-width: 1120px;
  margin: 0 auto;
  padding: 16px clamp(14px, 3vw, 28px) 36px;
  display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  color: var(--ink-faint);
  font-size: 12.5px;
  border-top: var(--border-w) solid var(--line);
}

/* =============================================================
   7. HERO (home)
   ============================================================= */

.hero {
  position: relative;
  overflow: hidden;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel-raised);
  box-shadow: var(--shadow);
  padding: clamp(22px, 4vw, 40px);
  margin: 0 0 34px;
}
.hero::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(640px 300px at 92% -40%, var(--accent-soft) 0%, transparent 70%),
    linear-gradient(90deg, transparent 0%, transparent 100%);
  pointer-events: none;
}
[data-theme="industrial"] .hero::before { display: none; }
[data-theme="industrial"] .hero {
  border-left: 14px solid #ffd400;
}
.hero > * { position: relative; }

.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 11.5px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
}
.hero-eyebrow .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 0 var(--accent);
  animation: pulse 2.4s ease-out infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--accent-line); }
  70%  { box-shadow: 0 0 0 10px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.hero h1 { margin-bottom: 10px; }
.hero-sub { color: var(--ink-soft); margin: 0; max-width: 60ch; }

.hero-stats {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin: 24px 0 0;
}
.stat {
  flex: 1 1 128px;
  padding: 13px 16px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
}
.stat b {
  display: block;
  font-size: 25px; font-weight: 800; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
[data-theme="industrial"] .stat b { color: var(--ink); }
.stat span {
  display: block; margin-top: 3px;
  font-size: 11px; letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
}

/* =============================================================
   8. TILES
   ============================================================= */

.tile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
  gap: 14px;
}
.tile-grid.two { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

.tile {
  position: relative;
  display: flex; flex-direction: column; gap: 4px;
  text-align: left; width: 100%; cursor: pointer;
  padding: 20px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--tile-skin);
  box-shadow: var(--shadow);
  color: var(--ink);
  overflow: hidden;
  transition: transform .14s cubic-bezier(.2,.7,.3,1), box-shadow .14s, border-color .14s;
}
.tile::after {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--tile-accent, transparent);
  transition: width .14s;
}
.tile:hover {
  transform: translateY(-3px);
  border-color: var(--tile-accent, var(--line-strong));
  box-shadow: var(--shadow-lift);
}
.tile:hover::after { width: 6px; }
.tile:active { transform: translateY(0); }

.tile-icon {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  margin-bottom: 12px;
  border-radius: var(--radius-sm);
  background: var(--tile-tint, var(--accent-soft));
  border: var(--border-w) solid var(--tile-accent, var(--accent-line));
  color: var(--tile-accent, var(--accent));
  flex: 0 0 auto;
}
.tile-icon svg { width: 26px; height: 26px; }
.tile-icon .glyph { font-size: 22px; line-height: 1; }

.tile-title { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.tile-sub { color: var(--ink-soft); font-size: 13.5px; }
.tile-meta {
  margin-top: 12px;
  font-size: 11px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
  display: flex; align-items: center; gap: 7px;
}

/* the two big ones */
.tile.hero-tile { padding: 26px; }
.tile.hero-tile .tile-title { font-size: 21px; }
.tile.hero-tile .tile-icon { width: 56px; height: 56px; }
.tile.hero-tile .tile-icon svg { width: 32px; height: 32px; }

/* =============================================================
   9. BADGES, CHIPS
   ============================================================= */

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 11px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  white-space: nowrap;
  border: var(--border-w) solid;
}
[data-theme="industrial"] .badge { border-radius: 3px; }
.badge.draft { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-line); }
.badge.ok    { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.badge.dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}
[data-theme="industrial"] .badge.draft { color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.chips li {
  padding: 6px 13px;
  font-size: 13.5px; font-weight: 600;
  border: var(--border-w) solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-soft);
}
[data-theme="industrial"] .chips li { border-radius: 3px; color: var(--ink); }

/* =============================================================
   10. CALLOUTS
   ============================================================= */

.callout {
  position: relative;
  padding: 15px 18px 15px 20px;
  margin: 0 0 16px;
  border: var(--border-w) solid;
  border-left-width: 5px;
  border-radius: var(--radius-sm);
  font-size: 15px;
}
.callout strong {
  display: block; margin-bottom: 4px;
  font-size: 12px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
}
.callout.danger { background: var(--red-soft);    border-color: var(--red-line);    color: var(--red); }
.callout.warn   { background: var(--amber-soft);  border-color: var(--amber-line);  color: var(--amber); }
.callout.info   { background: var(--blue-soft);   border-color: var(--blue-line);   color: var(--blue); }
.callout.good   { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
[data-theme="industrial"] .callout { color: var(--ink); }
[data-theme="industrial"] .callout.danger { border-left-color: #b3160f; }
[data-theme="industrial"] .callout.warn   { border-left-color: #ffd400; }
[data-theme="industrial"] .callout.info   { border-left-color: #11399e; }
[data-theme="industrial"] .callout.good   { border-left-color: #0b7a3f; }

/* =============================================================
   11. CARDS
   ============================================================= */

.card {
  padding: 20px;
  margin: 0 0 16px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
}
.card-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
.card-row .card { margin: 0; }

.kv {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.kv:last-of-type { border-bottom: 0; padding-bottom: 0; }
.kv > span { color: var(--ink-soft); }
.kv > b { text-align: right; font-variant-numeric: tabular-nums; }

/* readings, shown like instruments */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(154px, 1fr)); gap: 12px; }
.gauge {
  padding: 15px 16px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
.gauge::before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
[data-theme="industrial"] .gauge::before { background: #ffd400; height: 5px; }
.gauge-k {
  display: block;
  font-size: 10.5px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 6px;
}
.gauge-v {
  display: block;
  font-family: var(--font-mono);
  font-size: 19px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  line-height: 1.25;
  word-break: break-word;
}
[data-theme="industrial"] .gauge-v { color: var(--ink); }

/* =============================================================
   12. SIGN OFF + PROGRESS
   ============================================================= */

.signoff { display: flex; flex-wrap: wrap; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 200px; }
.field > span, .field { font-size: 12px; }
.field > span {
  font-weight: 800; letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
}
.field input, .field textarea {
  padding: 11px 13px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font-size: 15.5px;
}
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--accent-line); box-shadow: var(--glow);
}
[data-theme="industrial"] .field input,
[data-theme="industrial"] .field textarea { background: #fff; }

.progress-wrap { position: sticky; top: 68px; z-index: 20; margin: 0 0 20px; }
.progress-card {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 13px 18px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
[data-theme="industrial"] .progress-card { backdrop-filter: none; -webkit-backdrop-filter: none; }
.count {
  font-weight: 800; font-size: 14px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}
.bar {
  flex: 1 1 170px; height: 10px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
  overflow: hidden;
}
[data-theme="industrial"] .bar { border-radius: 2px; border-width: 2px; height: 14px; }
.bar > span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--blue)));
  box-shadow: 0 0 14px -2px var(--accent);
  transition: width .3s cubic-bezier(.2,.7,.3,1);
}
[data-theme="industrial"] .bar > span { background: #0b7a3f; box-shadow: none; }

.saved-flag { font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
.saved-flag.just { color: var(--accent); font-weight: 800; }

/* =============================================================
   13. STEPS
   ============================================================= */

.steps { list-style: none; margin: 0; padding: 0; }

.step {
  position: relative;
  display: flex; gap: 16px; align-items: flex-start;
  padding: 18px 20px;
  margin: 0 0 12px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  transition: border-color .16s, background .16s, transform .1s;
}
.step:hover { border-color: var(--line-strong); }
.step.done {
  background: var(--accent-soft);
  border-color: var(--accent-line);
}
.step.done .step-title { opacity: .62; text-decoration: line-through; text-decoration-thickness: 2px; }

.step-check {
  flex: 0 0 auto;
  width: 30px; height: 30px; margin: 1px 0 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.step-body { flex: 1 1 auto; min-width: 0; }
.step-head { display: flex; align-items: flex-start; gap: 11px; }

.step-no {
  flex: 0 0 auto;
  min-width: 28px; height: 28px;
  display: grid; place-items: center;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: var(--accent); color: var(--accent-ink);
  font-size: 13px; font-weight: 800;
  font-variant-numeric: tabular-nums;
}
[data-theme="industrial"] .step-no { border: 2px solid #15130f; }
.step-title { font-weight: 700; font-size: 16.5px; }
.step-detail { margin: 10px 0 0; color: var(--ink-soft); }

.step-meta {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
}
.step-meta > span {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-faint);
}
[data-theme="industrial"] .step-meta > span { border-radius: 3px; border-width: 2px; color: var(--ink-soft); }
.step-meta b { color: var(--ink); font-weight: 700; }

.step-checks { margin: 12px 0 0; padding: 0; list-style: none; }
.step-checks li {
  position: relative;
  padding: 3px 0 3px 24px;
  font-size: 14.5px;
  color: var(--ink-soft);
}
.step-checks li::before {
  content: "";
  position: absolute; left: 2px; top: 10px;
  width: 11px; height: 6px;
  border-left: 2.4px solid var(--accent);
  border-bottom: 2.4px solid var(--accent);
  transform: rotate(-45deg);
}

/* alarms are not good news, so they do not get a green tick */
.step-checks.alarm li::before {
  width: 9px; height: 9px;
  top: 9px; left: 3px;
  border: 0; border-radius: 50%;
  background: var(--red);
  transform: none;
  box-shadow: 0 0 0 3px var(--red-soft);
}

.step-warn {
  margin-top: 12px;
  padding: 11px 14px;
  border: var(--border-w) solid var(--red-line);
  border-left-width: 4px;
  border-radius: var(--radius-sm);
  background: var(--red-soft);
  color: var(--red);
  font-size: 14px;
}
[data-theme="industrial"] .step-warn { color: var(--ink); }
.step-warn b { letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }

/* =============================================================
   14. BUTTONS
   ============================================================= */

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 46px;
  padding: 11px 19px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink);
  font-weight: 700; font-size: 15px;
  cursor: pointer;
  transition: background .14s, border-color .14s, transform .08s, box-shadow .14s;
}
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.btn:hover { border-color: var(--line-strong); background: var(--panel-hover); }
.btn:active { transform: translateY(1px); }

.btn.primary {
  background: var(--accent); border-color: var(--accent-line); color: var(--accent-ink);
}
.btn.primary:hover { filter: brightness(1.1); background: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--red-soft); border-color: var(--red-line); color: var(--red); }
[data-theme="industrial"] .btn.danger { color: var(--ink); }
.btn.small { min-height: 36px; padding: 6px 13px; font-size: 13.5px; }
.btn.wide { width: 100%; }

[data-theme="industrial"] .btn { box-shadow: 3px 3px 0 0 #15130f; }
[data-theme="industrial"] .btn:active { box-shadow: 1px 1px 0 0 #15130f; transform: translate(2px, 2px); }

/* =============================================================
   15. TROUBLESHOOTING
   ============================================================= */

.ask-card {
  padding: clamp(22px, 3.4vw, 34px);
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel-raised);
  box-shadow: var(--shadow-lift);
  position: relative;
  overflow: hidden;
}
.ask-card::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(520px 240px at 86% -30%, var(--amber-soft) 0%, transparent 70%);
  pointer-events: none;
}
[data-theme="industrial"] .ask-card::before { display: none; }
.ask-card > * { position: relative; }

.ask-step {
  font-size: 11.5px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--amber);
  margin: 0 0 10px;
}
.ask-q { font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; margin: 0 0 8px; line-height: 1.25; }
.ask-hint { color: var(--ink-soft); margin: 0 0 22px; }

.ask-options { display: grid; gap: 11px; }
.ask-option {
  display: flex; align-items: center; gap: 14px;
  text-align: left; cursor: pointer;
  padding: 17px 19px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  font-weight: 700; font-size: 16.5px;
  transition: border-color .14s, background .14s, transform .1s;
}
.ask-option:hover {
  border-color: var(--accent-line); background: var(--accent-soft); transform: translateX(3px);
}
.ask-option .key {
  flex: 0 0 auto;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 800;
  color: var(--ink-faint);
}
.ask-option:hover .key { border-color: var(--accent-line); color: var(--accent); }

.trail { list-style: none; margin: 0 0 20px; padding: 0; }
.trail li {
  display: flex; gap: 10px; align-items: baseline;
  padding: 9px 0 9px 16px;
  border-left: var(--border-w) solid var(--line);
  font-size: 14px; color: var(--ink-faint);
  position: relative;
}
.trail li::before {
  content: "";
  position: absolute; left: -5px; top: 15px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-line);
}
.trail b { color: var(--ink); }

.fix-head {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px;
  margin: 0 0 18px;
  border: var(--border-w) solid var(--accent-line);
  border-radius: var(--radius);
  background: var(--accent-soft);
}
.fix-head h2 {
  margin: 0; color: var(--accent); font-size: clamp(18px, 2.4vw, 23px);
  letter-spacing: var(--head-tracking); text-transform: none;
}
.fix-head h2::after { display: none; }
[data-theme="industrial"] .fix-head h2 { color: var(--ink); }
.fix-head .tick {
  flex: 0 0 auto; width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
}
[data-theme="industrial"] .fix-head .tick { border-radius: 3px; border: 2px solid #15130f; }

/* =============================================================
   16. RESULT ROWS (search, fault list)
   ============================================================= */

.result {
  display: flex; align-items: center; gap: 15px;
  width: 100%; text-align: left; cursor: pointer;
  padding: 15px 18px;
  margin: 0 0 10px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  transition: border-color .14s, background .14s, transform .1s;
}
.result:hover { border-color: var(--accent-line); background: var(--panel-hover); transform: translateX(3px); }
.result-ico {
  flex: 0 0 auto; width: 40px; height: 40px;
  display: grid; place-items: center;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--accent);
  font-size: 19px;
}
.result-ico svg { width: 22px; height: 22px; }
.result-body { min-width: 0; flex: 1 1 auto; }
.result-kind {
  display: block;
  font-size: 10.5px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
}
.result-title { display: block; font-weight: 700; margin: 2px 0; }
.result-snip { display: block; color: var(--ink-soft); font-size: 13.5px; }
.result-go { flex: 0 0 auto; color: var(--ink-faint); }
.result:hover .result-go { color: var(--accent); }

.empty {
  padding: 46px 20px; text-align: center;
  color: var(--ink-faint);
  border: var(--border-w) dashed var(--line);
  border-radius: var(--radius);
}

/* =============================================================
   17. PLANT MAP — full area, no squinting
   ============================================================= */

.map-page {
  display: flex; flex-direction: column;
  gap: 12px;
}

.map-head {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.map-head h1 { margin: 0; }
.map-head .lede { margin: 0; }
.map-headtext { min-width: 0; flex: 1 1 320px; }

/* the stage fills what is left of the screen */
.map-stage {
  position: relative;
  height: var(--stage-h, 70vh);
  min-height: 380px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--map-canvas);
  background-image:
    linear-gradient(var(--map-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--map-grid) 1px, transparent 1px);
  background-size: 34px 34px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.map-scroll {
  position: absolute; inset: 0;
  overflow: auto;
  cursor: grab;
  -webkit-overflow-scrolling: touch;
  display: grid; place-items: center;
  /* room for the floating controls so no machine ever hides under them */
  padding: 66px 16px 54px;
}
.map-scroll.grabbing { cursor: grabbing; }
.plantmap { display: block; max-width: none; }

/* floating glass controls over the map */
.map-overlay {
  position: absolute;
  z-index: 6;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: var(--shadow);
  max-width: calc(100% - 24px);
}
[data-theme="industrial"] .map-overlay { backdrop-filter: none; -webkit-backdrop-filter: none; }
.map-overlay.tl { top: 12px; left: 12px; }
.map-overlay.tr { top: 12px; right: 12px; }
.map-overlay.br { bottom: 12px; right: 12px; }
.map-overlay.bl { bottom: 12px; left: 12px; font-size: 12px; color: var(--ink-faint); padding: 7px 12px; }

.map-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px;
  border: var(--border-w) solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-faint);
  font-size: 12.5px; font-weight: 700;
  cursor: pointer;
  transition: color .14s, border-color .14s, background .14s;
}
[data-theme="industrial"] .map-chip { border-radius: 3px; }
.map-chip .dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--chip, currentColor);
  background: transparent;
}
.map-chip.on { color: var(--ink); border-color: var(--chip); background: var(--panel-hover); }
.map-chip.on .dot { background: var(--chip); box-shadow: 0 0 8px -1px var(--chip); }

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  transition: color .14s, border-color .14s, background .14s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--panel-hover); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.wide {
  width: auto; padding: 0 13px;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
}
.zoom-val {
  min-width: 48px; text-align: center;
  font-size: 12.5px; font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
}

/* true full screen for the map */
body.map-full { overflow: hidden; }
body.map-full .topbar,
body.map-full .draft-banner,
body.map-full .footer { display: none; }
body.map-full .view { padding: 0; max-width: none; }
body.map-full .map-head,
body.map-full .map-extra { display: none; }
body.map-full .map-stage {
  position: fixed; inset: 0;
  height: 100vh; width: 100vw;
  border: 0; border-radius: 0;
  z-index: 100;
}

/* svg text inside the map */
.mnode { cursor: pointer; }
.mnode .hit { fill: transparent; }
.mnode:hover .plate { filter: brightness(1.14); }
.map-nodelabel { font-family: var(--font); font-size: 11.5px; font-weight: 700; text-anchor: middle; pointer-events: none; }
.map-tag       { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-anchor: middle; pointer-events: none; letter-spacing: .02em; }
.area-label    { font-family: var(--font); font-size: 13.5px; font-weight: 800; pointer-events: none; }
.area-count    { font-family: var(--font); font-size: 11px; font-weight: 600; pointer-events: none; }
.map-edgelabel {
  font-family: var(--font); font-size: 10.5px; font-weight: 700;
  text-anchor: middle; pointer-events: none;
  paint-order: stroke; stroke: var(--map-canvas); stroke-width: 4px; stroke-linejoin: round;
}
.map-guess { font-family: var(--font); font-size: 12px; font-weight: 800; text-anchor: middle; pointer-events: none; }
.flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
[data-theme="industrial"] .flow { animation: none; stroke-dasharray: 8 6; }

/* area legend under the map */
.legend-inline { display: flex; flex-wrap: wrap; gap: 8px; }
.plant-chip {
  padding: 5px 12px;
  border: var(--border-w) solid;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 700;
}
[data-theme="industrial"] .plant-chip { border-radius: 3px; border-color: #15130f; }

/* =============================================================
   18. MACHINE / AREA HEADER
   ============================================================= */

.machine-head {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 20px 22px;
  margin: 0 0 18px;
  border: var(--border-w) solid var(--line);
  border-left-width: 6px;
  border-radius: var(--radius);
  background: var(--panel-raised);
  box-shadow: var(--shadow);
}
.machine-icon {
  flex: 0 0 auto;
  width: 68px; height: 68px;
  display: grid; place-items: center;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
}
.machine-headtext { min-width: 0; flex: 1 1 260px; }
.machine-head h1 { font-size: clamp(21px, 2.8vw, 29px); margin: 3px 0 0; }
.machine-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 700; letter-spacing: .05em;
  padding: 3px 9px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink-soft);
}

.blank-card { background: transparent; border-style: dashed; }
.blank-card h3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.joined { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.joined > div > b {
  display: block; margin-bottom: 10px;
  font-size: 11px; font-weight: 800;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  color: var(--ink-faint);
}
.joined-list { display: flex; flex-direction: column; gap: 8px; }
.joined-btn {
  display: flex; flex-direction: column; gap: 2px;
  text-align: left; cursor: pointer;
  padding: 11px 13px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink);
  font-weight: 700; font-size: 14.5px;
  transition: border-color .14s, background .14s, transform .1s;
}
.joined-btn:hover { border-color: var(--accent-line); background: var(--panel-hover); transform: translateX(3px); }
.joined-btn span { font-weight: 500; font-size: 12px; color: var(--ink-faint); }

/* =============================================================
   19. INTERVIEW SHEETS
   ============================================================= */

.qblock { padding: 16px 0; border-top: 1px solid var(--line); }
.card > .qblock:first-of-type { border-top: 0; padding-top: 2px; }
.qlabel { display: block; font-weight: 700; margin: 0 0 5px; font-size: 15.5px; }
.qhint { margin: 0 0 10px; color: var(--ink-faint); font-size: 13.5px; }

.ans {
  width: 100%;
  padding: 12px 14px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font: inherit; line-height: 1.5;
}
[data-theme="industrial"] .ans { background: #fff; }
.ans:focus { outline: none; border-color: var(--accent-line); box-shadow: var(--glow); }
textarea.ans { resize: vertical; min-height: 56px; }

.isteps { display: flex; flex-direction: column; gap: 12px; margin: 0 0 14px; }
.istep {
  padding: 16px;
  border: var(--border-w) solid var(--line);
  border-left: 5px solid var(--accent-line);
  border-radius: var(--radius-sm);
  background: var(--panel);
}
.istep-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.field.wide { width: 100%; flex: 1 1 100%; margin-bottom: 11px; }
.field.wide:last-child { margin-bottom: 0; }

.sendbox {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12.5px; line-height: 1.55;
  padding: 14px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
}
[data-theme="industrial"] .sendbox { background: #fff; }

.filepick {
  display: block; width: 100%;
  margin: 0 0 14px;
  padding: 13px;
  border: var(--border-w) dashed var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 14.5px;
}

/* =============================================================
   20. THEME PICKER
   ============================================================= */

.theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.theme-card {
  text-align: left; cursor: pointer;
  padding: 0; overflow: hidden;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  transition: border-color .14s, transform .12s, box-shadow .14s;
}
.theme-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.theme-card.on { border-color: var(--accent); box-shadow: var(--glow); }
.theme-swatch { height: 86px; display: flex; }
.theme-swatch i { flex: 1; }
.theme-card-body { padding: 14px 16px; }
.theme-card-body b { display: block; font-size: 15.5px; }
.theme-card-body span { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

/* =============================================================
   21. SMALL SCREENS
   ============================================================= */

@media (max-width: 860px) {
  .joined { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  body { font-size: 16px; }
  .topbar { flex-wrap: wrap; row-gap: 10px; }
  .search { flex: 1 1 100%; order: 3; }
  .brand { order: 1; }
  .nav-btn .lbl { display: none; }
  .nav-btn { padding: 0 12px; }
  .progress-wrap { position: static; }
  .hero-stats .stat { flex: 1 1 calc(50% - 10px); }

  /* on a phone the controls stay floating, but the stream filters
     become one row you can swipe, and the zoom bar drops to the
     bottom so the two never sit on top of each other */
  .map-overlay { padding: 6px; gap: 6px; }
  .map-overlay.tl {
    top: 10px; left: 10px; right: 10px;
    max-width: none;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .map-overlay.tl::-webkit-scrollbar { display: none; }
  .map-overlay.tl .map-chip { flex: 0 0 auto; font-size: 11.5px; padding: 5px 10px; }
  .map-overlay.tr { top: auto; bottom: 10px; right: 10px; }
  .map-overlay.bl { display: none; }
  .map-scroll { padding: 62px 12px 66px; }
  .draft-banner { font-size: 12px; padding: 8px 14px; }
}

/* =============================================================
   22. PRINT
   ============================================================= */

@media print {
  .topbar, .footer, .btn-row, .draft-banner, .progress-wrap,
  .map-overlay, .sendbox, .filepick, .theme-grid, .result-go { display: none !important; }

  html, body {
    background: #fff !important;
    background-image: none !important;
    color: #000 !important;
    font-size: 11.5pt;
  }
  .view { max-width: none; padding: 0; animation: none; }
  .card, .step, .hero, .machine-head, .ask-card {
    box-shadow: none !important;
    border: 1px solid #999 !important;
    background: #fff !important;
    break-inside: avoid; page-break-inside: avoid;
  }
  h1, h2, h3 { color: #000 !important; }
  .lede, .step-detail, .step-checks li, .kv > span { color: #333 !important; }
  .step-check {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border: 1.5px solid #333; border-radius: 2px;
  }
  .step-no { background: #000 !important; color: #fff !important; }
  .gauge-v, .stat b { color: #000 !important; }
  .ans { border: 0; border-bottom: 1px solid #999; border-radius: 0; min-height: 0; background: #fff; }
  textarea.ans { min-height: 46px; }
  .map-stage {
    height: auto !important; min-height: 0;
    border: 1px solid #999 !important; background: #fff !important; background-image: none !important;
  }
  .map-scroll { position: static; overflow: visible; padding: 0; }
  .flow { animation: none; }
}

      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "industrial" ? "#15130f" : "#0d1714");

})();

            "Tell the supervisor so the run can be re-planned.",
            "Do not run it to get through the shift."
          ],
          escalate: "Worn hammers, loose bolts or hot bearings can break up at speed. Keep it off until maintenance clears it."
        }
      },
      "fix-elec": {
        fix: {
          title: "Trips with no load — electrical",
          steps: [
            "Leave the lockout on and do not keep resetting it.",
            "Note the overload setting and what the fault display says.",
            "Call an electrician.",
            "Check whether anything was recently worked on in that panel."
          ],
          escalate: "Repeated resetting of a tripping starter can start a fire. Electrician only."
        }
      },
      "fix-load": {
        fix: {
          title: "Trips only when it is working",
          steps: [
            "Reduce the feed rate and feed evenly instead of in surges.",
            "Check the screen size and the material size coming in.",
            "Check the drive belts for slipping or a glazed look.",
            "Compare the running current with the normal figure on the standard sheet.",
            "If it still trips at low feed, treat it as mechanical and get maintenance."
          ],
          escalate: "Do not wind the overload setting up to stop it tripping. That is how motors burn out."
        }
      }
    }
  },

  /* ---------------------------------------------------------- */
  {
    id: "odour-complaint",
    area: "Odour",
    icon: "\u{1F443}",
    title: "Strong smell, or a neighbour complaint",
    symptom: "Smell noticed on the boundary, or someone has rung in to complain",
    status: "draft",
    nodes: {
      start: {
        q: "Is the odour control system running right now — fans, scrubber and biofilter?",
        options: [
          { label: "No — something is stopped", next: "fix-notrunning" },
          { label: "Yes — it is all running", next: "building" }
        ]
      },
      building: {
        q: "Are any big doors, hatches or inspection covers open?",
        hint: "An open roller door undoes the whole extraction system in seconds.",
        options: [
          { label: "Yes", next: "fix-doors" },
          { label: "No — everything is shut", next: "condenser" }
        ]
      },
      condenser: {
        q: "Is the condenser working properly — cooling water flowing, no vapour out the vent?",
        options: [
          { label: "No — vapour is getting out", next: "fix-condenser" },
          { label: "Yes — condenser is fine", next: "sources" }
        ]
      },
      sources: {
        q: "Check the other usual sources — old raw material, a full effluent sump, uncovered bins, spilled product.",
        options: [
          { label: "Found something", next: "fix-source" },
          { label: "Nothing found", next: "fix-escalate" }
        ]
      },
      "fix-notrunning": {
        fix: {
          title: "Odour control is not running",
          steps: [
            "Stop cooking. This is the one thing you do not run without.",
            "Start whatever has stopped, if it is safe and you are trained to.",
            "If it will not start, call maintenance and the supervisor immediately.",
            "Record the exact time it stopped and the time it came back.",
            "Expect to have to report this — write everything down as you go."
          ],
          escalate: "Treat this as a reportable event. The supervisor decides on notifying the regulator, not the operator."
        }
      },
      "fix-doors": {
        fix: {
          title: "Open doors letting the smell out",
          steps: [
            "Shut the doors and hatches now.",
            "Check the building pulls the doors shut again, which means extraction is working.",
            "Tell the team and the forklift drivers to keep doors shut.",
            "If a door has to stay open for work, get the supervisor to agree it first.",
            "Record what was open and for how long."
          ],
          escalate: "If a door will not close or a seal is damaged, raise a job the same day."
        }
      },
      "fix-condenser": {
        fix: {
          title: "Condenser not holding the vapour",
          steps: [
            "Cut the cooker feed back straight away to reduce the vapour load.",
            "Check the cooling water pump, flow and the cooling tower fan.",
            "Check the water in and out temperatures against normal.",
            "Check the condenser for fouling or a blocked tube bundle.",
            "Hold the feed low until the vent is clear again."
          ],
          escalate: "If the vapour does not clear, stop cooking and call maintenance and the supervisor."
        }
      },
      "fix-source": {
        fix: {
          title: "A specific smell source found",
          steps: [
            "Deal with it now: process old material, cover the bin, clean the spill, or pump down the sump.",
            "Hose the area down and make sure the drains run clear.",
            "Write down what it was and when you fixed it.",
            "Tell the supervisor so it can be stopped from happening again."
          ],
          escalate: "If it keeps coming back from the same place, it needs a permanent fix, not a daily clean-up."
        }
      },
      "fix-escalate": {
        fix: {
          title: "Smell with no obvious cause",
          steps: [
            "Note the time, the wind direction and exactly where you could smell it.",
            "Walk the boundary and mark the strongest point.",
            "Reduce the cooking rate while you investigate.",
            "Call the supervisor with your notes.",
            "If a member of the public has complained, record their details and the time, and pass them straight to the supervisor."
          ],
          escalate: "Every complaint must go to the supervisor the same shift, with the time, wind direction and what the plant was doing."
        }
      }
    }
  },

  /* ---------------------------------------------------------- */
  {
    id: "steam-low",
    area: "Boiler / Steam",
    icon: "\u{1F4A6}",
    title: "Steam pressure low across the plant",
    symptom: "Pressure down everywhere, cookers falling behind, boiler struggling",
    status: "draft",
    nodes: {
      start: {
        q: "Is the boiler firing?",
        options: [
          { label: "No — burner is off or locked out", next: "fix-burner" },
          { label: "Yes — it is firing hard but losing ground", next: "demand" }
        ]
      },
      demand: {
        q: "Has the steam demand suddenly gone up?",
        hint: "Several cookers starting together, a big washdown, or trace heating all coming on at once.",
        options: [
          { label: "Yes", next: "fix-demand" },
          { label: "No", next: "water" }
        ]
      },
      water: {
        q: "Is the boiler water level and feedwater normal?",
        options: [
          { label: "No — level is low or swinging", next: "fix-water" },
          { label: "Yes — level is steady", next: "fix-leak" }
        ]
      },
      "fix-burner": {
        fix: {
          title: "Boiler not firing",
          steps: [
            "Call the boiler attendant. Do not try to reset a boiler lockout unless you are the trained attendant.",
            "Cut all cooker feed back and stop raw intake.",
            "Note what the boiler fault display says.",
            "Keep odour control and the condenser running.",
            "Prepare for a controlled shutdown if it will not come back."
          ],
          escalate: "A boiler lockout is for the trained boiler attendant only. Never bypass a boiler safety device."
        }
      },
      "fix-demand": {
        fix: {
          title: "Too much demand at once",
          steps: [
            "Stage the load — do not start everything together.",
            "Hold off washdown and non-urgent trace heating until pressure recovers.",
            "Bring cookers up one at a time.",
            "Agree a starting order with the supervisor so it does not happen again."
          ],
          escalate: "If the plant simply cannot make enough steam for the planned run rate, that is a planning issue for the supervisor."
        }
      },
      "fix-water": {
        fix: {
          title: "Water level or feedwater problem",
          steps: [
            "Boiler attendant takes over from here.",
            "Check the feedwater tank level and temperature.",
            "Check the feedwater pump is running and not cavitating.",
            "Check for a stuck level control or a dirty sight glass.",
            "Reduce steam demand while it is sorted out."
          ],
          escalate: "Low water in a boiler is dangerous. If the level cannot be confirmed, the boiler must be shut down to the boiler procedure."
        }
      },
      "fix-leak": {
        fix: {
          title: "Steam is being lost somewhere",
          steps: [
            "Walk the steam lines and listen for leaks, including outside and in roof spaces.",
            "Check for traps blowing through, which dumps live steam.",
            "Check for a valve left open to a line that is not in use.",
            "Check the condensate return — a lot of flash steam there means a passing trap.",
            "Raise jobs for everything you find and keep the list."
          ],
          escalate: "Report any leak you can hear from a walkway straight away. Never approach a visible steam jet."
        }
      }
    }
  },

  /* ---------------------------------------------------------- */
  {
    id: "foreign-body",
    area: "Quality",
    icon: "\u{1F50E}",
    title: "Metal or foreign object found in product",
    symptom: "Metal detector alarm, magnet find, or something found in a bag or bin",
    status: "draft",
    nodes: {
      start: {
        q: "Has the affected product already left the site?",
        options: [
          { label: "No — it is still here", next: "onsite" },
          { label: "Yes — it has been dispatched", next: "fix-dispatched" },
          { label: "Not sure", next: "fix-dispatched" }

      onsite: {
        q: "Can you tell which batch or time period it affects?",

          { label: "Yes", next: "fix-hold-known" },
          { label: "No", next: "fix-hold-wide" }

      "fix-hold-known": {
        fix: {
          title: "Hold the known batch",
          steps: [
            "Stop the line at that point.",
            "Put the batch on hold with a clear HOLD label, and move it away from good stock.",
            "Keep the object you found. Bag it, label it, do not throw it out.",
            "Write down the time, the machine, the batch and who found it.",
            "Find where it came from before restarting — check magnets, screens, broken machine parts and recent maintenance.",
            "Count the tools and parts from any recent job in that area."

          escalate: "The supervisor and quality decide whether the batch is released, reworked or dumped. Not the operator."
        }
      },
      "fix-hold-wide": {
        fix: {
          title: "Cannot pin the batch down — hold wide",
          steps: [
            "Hold everything made since the last good check. When in doubt, hold more, not less.",
            "Label it all HOLD and separate it from good stock.",
            "Keep the object, bagged and labelled.",
            "Check the machines upstream for missing or broken parts.",
            "Call the supervisor and quality now."
          ],
          escalate: "Widening a hold is cheap. A customer finding metal is not. Always hold wide when you are unsure."
        }
      },
      "fix-dispatched": {
        fix: {
          title: "Product may already have gone out",
          steps: [
            "Tell the supervisor and the quality manager immediately. This is urgent.",
            "Find the dispatch records: which customer, which batch, when it left.",
            "Keep the object and every record you have.",
            "Hold all remaining stock from the same batches.",
            "Do not contact the customer yourself — that is the manager's job."
          ],
          escalate: "This may become a recall. Management handles customer contact and any notification. Your job is accurate records, fast."
        }
      }
    }
  }

];
</script>

  /* =============================================================
     THEMES

  var THEMES = {

  var theme = "control";

  function loadTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);

    applyTheme();
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    var m = document.querySelector('meta[name="theme-color"]');

    var btn = document.getElementById("themeBtn");

  function setTheme(t) {
    if (!THEMES[t]) return;
    theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    applyTheme();
    route();
  }

  function flipTheme() {
    setTheme(theme === "control" ? "industrial" : "control");
  }

  function dark() { return theme === "control"; }

  var STREAM_COLORS = {

    eye:      '<path d="M2.4 12s3.6-6.4 9.6-6.4S21.6 12 21.6 12s-3.6 6.4-9.6 6.4S2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="2.8"/>',

  /* tiles and rows get a real icon where there is a sensible one,

  var PROC_ART = {
    "startup-plant":      "play",

    "line-ovine":         "cooker",
    "line-mbm":           "mill",
    "line-tallow":        "tank",
    "support-changeover": "refresh",
    "support-odour":      "fan"

  var FAULT_ART = {
    "cooker-temp":     "cooker",
    "meal-wet":        "press",
    "tallow-quality":  "tank",
    "mill-trip":       "mill",
    "odour-complaint": "fan",
    "steam-low":       "boiler",
    "foreign-body":    "metaldetector"
  };

  function art(name) {
    if (!name) return null;
    if (UI[name]) return UI[name];
    if (ICONS[name]) return ICONS[name];
    return null;
  }

  function svgIcon(name, size, width) {
    var a = art(name);
    if (!a) return "";
    var s = size || 24;
    return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" ' +
           'stroke="currentColor" stroke-width="' + (width || 1.8) + '" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + a + "</svg>";
  }

  /* an icon for a tile: proper svg if we have one, else the glyph */
  function tileArt(name, glyph) {
    var svg = svgIcon(name, 26, 1.7);
    return svg || '<span class="glyph">' + (glyph || "") + "</span>";
  }

  /* =============================================================
     SMALL HELPERS
     ============================================================= */

  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function procsIn(category) {
    return PROCS.filter(function (p) { return p.category === category; });
  }

  function statusBadge(status) {
    return status === "approved"
      ? '<span class="badge ok dot">Signed off</span>'
      : '<span class="badge draft dot">Draft &mdash; needs sign-off</span>';
  }

  function go(hash) { location.hash = hash; }

  function btn(cls, icon, label, onclick) {
    return '<button class="btn ' + cls + '" onclick="' + onclick + '">' +
           svgIcon(icon, 17) + "<span>" + esc(label) + "</span></button>";
  }

     SAVED CHECKLIST STATE

  function loadState(id) {
    try {
      var raw = localStorage.getItem(STORE_PREFIX + id);
      return raw ? JSON.parse(raw) : { checked: {}, by: "", date: "" };
    } catch (e) {
      return { checked: {}, by: "", date: "" };
    }
  }

  function saveState(id, state) {
    try { localStorage.setItem(STORE_PREFIX + id, JSON.stringify(state)); } catch (e) {}
  }

  function loadAnswers() {
    try {
      var raw = localStorage.getItem(ANSWER_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveAnswers(obj) {
    try { localStorage.setItem(ANSWER_KEY, JSON.stringify(obj)); } catch (e) {
      alert("This device would not let me save. The storage may be full.");
    }
  }

  function countAnswered(iv) {
    var a = loadAnswers(), total = 0, done = 0;
    iv.sections.forEach(function (s) {
      s.questions.forEach(function (q) {
        total++;
        var v = a[iv.id + "." + q.id];
        if (q.type === "steps") {
          if (Array.isArray(v) && v.some(function (st) {
            return Object.keys(st).some(function (k) { return String(st[k] || "").trim(); });
          })) done++;
        } else if (String(v === undefined || v === null ? "" : v).trim()) done++;
      });
    });
    return { total: total, done: done };
  }

  function tile(hash, artName, glyph, title, sub, opts) {
    opts = opts || {};
    var style = "";
    if (opts.accent) style += "--tile-accent:" + opts.accent + ";";
    if (opts.tint) style += "--tile-tint:" + opts.tint + ";";
    return '<button class="tile ' + (opts.cls || "") + '"' +
             (style ? ' style="' + style + '"' : "") +
             ' onclick="Plant.go(\'' + hash + '\')">' +
             '<span class="tile-icon">' + tileArt(artName, glyph) + "</span>" +
             '<span class="tile-title">' + esc(title) + "</span>" +
             '<span class="tile-sub">' + esc(sub) + "</span>" +
             (opts.meta
               ? '<span class="tile-meta">' + esc(opts.meta) + svgIcon("chevron", 13) + "</span>"
               : "") +
           "</button>";
  }

  function accentFor(key) {
    var map = {
      green:  dark() ? "#2ce08c" : "#0b7a3f",
      amber:  dark() ? "#ffb74d" : "#a35a00",

      violet: dark() ? "#b794f6" : "#5b2bb8",
      red:    dark() ? "#ff6b60" : "#b3160f"
    };
    return map[key] || map.green;
  }

  function tintFor(key) {
    var map = {
      green:  dark() ? "rgba(44,224,140,.13)"  : "#d8f0e2",
      amber:  dark() ? "rgba(255,183,77,.13)"  : "#fff3cc",
      blue:   dark() ? "rgba(79,195,247,.13)"  : "#d9e2ff",
      violet: dark() ? "rgba(183,148,246,.13)" : "#e7dcff",
      red:    dark() ? "rgba(255,107,96,.13)"  : "#ffd9d6"
    };
    return map[key] || map.green;
  }

  function updateProgress(p) {
    if (!p) return;
    var state = loadState(p.id);
    var done = 0;
    for (var i = 0; i < p.steps.length; i++) if (state.checked[i]) done++;
    var pct = p.steps.length ? Math.round((done / p.steps.length) * 100) : 0;
    var c = document.getElementById("progCount");
    var b = document.getElementById("progBar");
    if (c) c.textContent = done + " of " + p.steps.length + " done";
    if (b) b.style.width = pct + "%";
  }

  function toggleStep(procId, index, checked) {
    var st = loadState(procId);
    if (checked) st.checked[index] = true; else delete st.checked[index];
    saveState(procId, st);
    var li = document.getElementById("step-" + index);
    if (li) li.className = "step" + (checked ? " done" : "");
    updateProgress(byId(PROCS, procId));
  }

  function resetChecks(procId) {
    var st = loadState(procId);
    st.checked = {};
    saveState(procId, st);
    renderProcedure(procId);
  }
