<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plant Guide">
<title>Plant Guide — Startup, Shutdown, Lines &amp; Troubleshooting</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="draftBanner" class="draft-banner">
  <strong>DRAFT COPY — EXAMPLE TEXT ONLY.</strong>
  Nothing in here has been approved yet. Do not follow these steps on the real plant until your
  supervisor has checked and signed off every page.
</div>

<header class="topbar">
  <button class="home-btn" onclick="location.hash='#/'" title="Back to the menu">Menu</button>
  <div class="brand">
    <span class="brand-name" id="plantName">Plant Guide</span>
    <span class="brand-sub">Startup &middot; Shutdown &middot; Lines &middot; Troubleshooting</span>
  </div>
  <form class="search" onsubmit="return Plant.onSearchSubmit(event)">
    <input id="searchInput" type="search" placeholder="Search e.g. cooker, pump, smell" autocomplete="off">
    <button type="submit">Search</button>
  </form>
</header>

<main id="view" class="view"></main>

<footer class="footer">
  <span>Works with no internet. Keep this on the control room tablet.</span>
  <span id="footMeta"></span>
</footer>

<script src="data/procedures.js"></script>
<script src="data/troubleshooting.js"></script>
<script src="app.js"></script>

<script>
/* Makes the app work with no internet once it has been opened once.
   Only runs on a real web address — skipped when the file is opened directly. */
(function () {
  var online = location.protocol === "https:" || location.protocol === "http:";
  if (online && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" })["catch"](function () {});
    });
  }
})();
</script>
</body>
</html>
